  const W = 5800, H = 5800, CX = W/2, CY = H/2;
  const rad = d => d * Math.PI / 180;
  const yearR = y => {
    if (y <= 2026) return 130 + (y - 1997) * 42;
    if (y <= 2035) return 130 + 29 * 42 + (y - 2026) * 55;
    return 130 + 29 * 42 + 9 * 55 + (y - 2035) * 75;

  const ALL_NODES = [];

    if (!CATS[cat]) return;
    const grp = groups[cat + '_' + year];
    const idx = grp.indexOf(n), cnt = grp.length;
    const baseA = CATS[cat].a;
    const spread = cnt > 1 ? 11 : 0;
    const offset = cnt > 1 ? (idx - (cnt-1)/2) * spread : 0;
    const hash = id.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    const angle = baseA + offset + (hash % 9) - 4;
    const r = yearR(year) + (hash % 13) - 6;
    nodes[id] = {
      id, name, year, cat, status, imp, parent, extra, source, owner: null,
      relation: 'parent',
      x: CX + r * Math.cos(rad(angle)),

      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g3" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffb700"/>
      <stop offset="70%" stop-color="#ff2a6d" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff2a6d" stop-opacity="0"/>
    </radialGradient>
  `;
  svg.appendChild(defs);

  const gRings = el('g', {class:'rings'});
  const gSect = el('g', {class:'sectors'});
  const gRelated = el('g', {class:'related'});
  const gLinks = el('g', {class:'links'});
  const gNodes = el('g', {class:'nodes'});
  svg.appendChild(gRings);
  svg.appendChild(gSect);
  svg.appendChild(gRelated);
  svg.appendChild(gLinks);
  svg.appendChild(gNodes);

  [1997, 2001, 2005, 2009, 2013, 2017, 2021, 2025, 2027, 2030, 2035, 2040, 2045, 2050].forEach(y => {
    const isFuture = y > 2026;
    gRings.appendChild(el('circle', {
      cx:CX, cy:CY, r: yearR(y), fill:'none',
      stroke: isFuture ? '#2a2a4a' : '#1a2a4a',
      'stroke-width':1,
      'stroke-dasharray': isFuture ? '3 8' : '2 9',
      opacity: isFuture ? .35 : .55
    }));
    const t = el('text', {
      x:CX, y:CY - yearR(y) - 8,
      fill: isFuture ? '#445577' : '#334466',
      'font-size': isFuture ? 12 : 11,
      'text-anchor':'middle',
      'font-family':'monospace',
      'letter-spacing':3,
      'font-weight': isFuture ? 700 : 400
    });
    t.textContent = y;
    gRings.appendChild(t);
  });

  Object.keys(CATS).forEach(k => {
    const c = CATS[k];
    const outer = yearR(2050) + 100;
    gSect.appendChild(el('line', {
      x1:CX, y1:CY,
      x2:CX + outer * Math.cos(rad(c.a)),
      y2:CY + outer * Math.sin(rad(c.a)),
      stroke:'#0d1424', 'stroke-width':1, opacity:.7
    }));
    const lr = yearR(2050) + 160;
    const t = el('text', {
      x:CX + lr * Math.cos(rad(c.a)),
      y:CY + lr * Math.sin(rad(c.a)),
      fill:c.c, 'font-size':14, 'text-anchor':'middle',
      'font-family':'monospace', 'letter-spacing':4,
      opacity:.75, 'font-weight':700
    });
    t.textContent = c.l;
    gSect.appendChild(t);
  });

  const relatedEls = [];
  RELATED.forEach(([a, b]) => {
    const n1 = nodes[a], n2 = nodes[b];
    if (!n1 || !n2) return;
    const line = el('line', {
      x1:n1.x, y1:n1.y, x2:n2.x, y2:n2.y,
      stroke:'#8899bb', 'stroke-width':1, opacity:.10,
      'stroke-dasharray':'4 4', class:'link-related'
    });
    line.dataset.from = a;
    line.dataset.to = b;
    line.dataset.related = '1';
    gRelated.appendChild(line);
    relatedEls.push(line);
  });

  const linkEls = [];
  ALL_NODES.forEach(id => {
    const c = nodes[id];
    if (!c || !c.parent) return;
    const p = nodes[c.parent];
    if (!p) return;
    const isFuture = FUTURE_STATUSES.indexOf(c.status) !== -1;
    const isHorizon = c.cat === 'horizon';
    const isScifi = c.cat === 'scifi';
    const st = ST[c.status] || ST.work;
    const line = el('line', {
      x1:p.x, y1:p.y, x2:c.x, y2:c.y,
      stroke: st.c,
      'stroke-width': isScifi ? 1.2 : isHorizon ? 1.2 : 1,
      opacity: isFuture ? .22 : .16,
      'stroke-dasharray': isScifi ? '2 6' : isHorizon ? '2 5' : isFuture ? '3 4' : 'none'
    });
    line.dataset.from = c.parent;
    line.dataset.to = id;
    gLinks.appendChild(line);
    linkEls.push(line);
  });

  gNodes.appendChild(el('circle', {cx:CX, cy:CY, r:70, fill:'url(#core)', filter:'url(#g3)', opacity:.95}));
  const coreT = el('text', {
    x:CX, y:CY+6, fill:'#fff', 'font-size':16, 'text-anchor':'middle',
    'font-weight':900, 'letter-spacing':5, filter:'url(#g2)',
    'font-family':'Inter, sans-serif'
  });
  coreT.textContent = 'ЯНДЕКС';
  gNodes.appendChild(coreT);

  const nodeEls = [];
  ALL_NODES.forEach(id => {
    const nd = nodes[id];
    if (!nd) return;
    const cat = CATS[nd.cat];
    const st = ST[nd.status] || ST.work;
    const baseR = 3.5 + nd.imp * 3.5;
    const filt = nd.imp === 3 ? 'url(#g3)' : nd.imp === 2 ? 'url(#g2)' : 'url(#g1)';
    const isFuture = FUTURE_STATUSES.indexOf(nd.status) !== -1;
    const isSpec = nd.status === 'speculation' || nd.status === 'speculativeHorizon';
    const isScifi = nd.cat === 'scifi';
    const isHorizon = nd.cat === 'horizon';

    const g = el('g', {class:'node', 'data-id': nd.id, 'data-cat': nd.cat, 'data-status': nd.status});
    g.appendChild(el('circle', {
      cx: nd.x, cy: nd.y, r: baseR * 2.4,
      fill: cat.c,
      opacity: isSpec || isScifi ? .04 : isFuture ? .08 : .12,
      filter:'url(#g3)'
    }));

    if (isScifi) {
      const s = baseR * 1.5;
      const points = `${nd.x},${nd.y-s} ${nd.x+s},${nd.y} ${nd.x},${nd.y+s} ${nd.x-s},${nd.y}`;
      g.appendChild(el('polygon', {
        points: points,
        fill: isFuture ? 'none' : st.c,
        stroke: '#ff66cc',
        'stroke-width': nd.imp === 3 ? 2.5 : 1.5,
        'stroke-dasharray': '3 3',
        filter: 'url(#g2)',
        opacity: isSpec ? .75 : 1
      }));
    } else if (isHorizon) {
      const s = baseR * 1.5;
      g.appendChild(el('rect', {
        x: nd.x - s, y: nd.y - s,
        width: s * 2, height: s * 2,
        fill: isFuture ? 'none' : st.c,
        stroke: isSpec ? '#776699' : cat.c,
        'stroke-width': nd.imp === 3 ? 2.5 : 1.5,
        'stroke-dasharray': isSpec ? '2 4' : '5 3',
        filter: 'url(#g2)',
        opacity: isSpec ? .75 : 1
      }));
    } else {
      g.appendChild(el('circle', {
        cx: nd.x, cy: nd.y, r: baseR,
        fill: isFuture ? 'none' : st.c,
        stroke: isSpec ? '#666' : cat.c,
        'stroke-width': nd.imp === 3 ? 2.5 : 1.5,
        'stroke-dasharray': isFuture ? (isSpec ? '2 4' : '5 3') : 'none',
        filter: isFuture ? 'url(#g2)' : filt,
        opacity: isSpec ? .7 : 1
      }));
      if (nd.imp === 3 && !isFuture) {
        g.appendChild(el('circle', {cx: nd.x, cy: nd.y, r: 2.2, fill:'#fff', opacity:.95}));
      }
    }

    const labelR = baseR + 10;
    const cosA = (nd.x - CX) / nd.r;
    const lx = nd.x + cosA * labelR;
    const ly = nd.y + ((nd.y - CY) / nd.r) * labelR;
    const anchor = cosA > 0.15 ? 'start' : cosA < -0.15 ? 'end' : 'middle';

    const t = el('text', {
      x: lx, y: ly + 3,
      fill: isScifi ? '#ff99dd' : isSpec ? '#776699' : isFuture ? '#8899bb' : '#cdd5e0',
      'font-size': nd.imp === 3 ? 13 : nd.imp === 2 ? 11 : 9.5,
      'font-weight': nd.imp === 3 ? 700 : nd.imp === 2 ? 600 : 400,
      'text-anchor': anchor,
      'font-family':'Inter, sans-serif',
      opacity: isSpec || isScifi ? .7 : nd.imp === 1 ? .6 : .95,
      'pointer-events':'none'
    });
    t.textContent = nd.name;
    g.appendChild(t);

    gNodes.appendChild(g);
    nodeEls.push(g);
  });

  const bg = document.getElementById('bg');
  const bgFragment = document.createDocumentFragment();
  for (let i = 0; i < 600; i++) {
    const s = document.createElement('div');
    s.className = 'bgstar';
    const sz = Math.random() * 1.8 + 0.4;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.animationDuration = (2 + Math.random() * 5) + 's';
    bgFragment.appendChild(s);
  }
  bg.appendChild(bgFragment);

  /* ============ ZOOM / PAN ============ */
  let tx = 0, ty = 0, scale = 1;
  const wrap = document.getElementById('wrap');

  function applyTransform() {
    const cw = window.innerWidth, ch = window.innerHeight;
    const fit = Math.min(cw / W, ch / H);
    const s = fit * scale;
    svg.style.transform = `translate(${cw/2 + tx}px, ${ch/2 + ty}px) scale(${s}) translate(${-W/2}px, ${-H/2}px)`;
  }
  applyTransform();
  window.addEventListener('resize', applyTransform);

  let dragging = false, dragMoved = false;
  let sx = 0, sy = 0, stx = 0, sty = 0;

  wrap.addEventListener('mousedown', e => {
    if (e.target.closest('.node')) return;
    dragging = true;
    dragMoved = false;
    sx = e.clientX;
    sy = e.clientY;
    stx = tx;
    sty = ty;
    wrap.classList.add('drag');
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    if (Math.abs(e.clientX - sx) > 3 || Math.abs(e.clientY - sy) > 3) dragMoved = true;
    tx = stx + (e.clientX - sx);
    ty = sty + (e.clientY - sy);
    applyTransform();
  });

  window.addEventListener('mouseup', () => {
    dragging = false;
    wrap.classList.remove('drag');
  });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    scale = Math.max(0.2, Math.min(10, scale * factor));
    applyTransform();
  }, {passive:false});

  /* ============ ФИЛЬТРАЦИЯ ============ */
  const activeStatuses = new Set();
  const activeCats = new Set();

  function applyFilters() {
    const hasStatusFilter = activeStatuses.size > 0;
    const hasCatFilter = activeCats.size > 0;

    nodeEls.forEach(n => {
      const status = n.dataset.status;
      const cat = n.dataset.cat;
      const statusMatch = !hasStatusFilter || activeStatuses.has(status);
      const catMatch = !hasCatFilter || activeCats.has(cat);
      const match = statusMatch && catMatch;

      if (hasStatusFilter || hasCatFilter) {
        n.classList.toggle('filter-dimmed', !match);
        n.classList.toggle('filter-highlight', match);
      } else {
        n.classList.remove('filter-dimmed', 'filter-highlight');
      }
    });

    linkEls.forEach(l => {
      if (hasStatusFilter || hasCatFilter) {
        const fromN = nodes[l.dataset.from];
        const toN = nodes[l.dataset.to];
        if (!fromN || !toN) return;
        const fromMatch = (!hasStatusFilter || activeStatuses.has(fromN.status)) && (!hasCatFilter || activeCats.has(fromN.cat));
        const toMatch = (!hasStatusFilter || activeStatuses.has(toN.status)) && (!hasCatFilter || activeCats.has(toN.cat));
        const active = fromMatch && toMatch;
        l.classList.toggle('link-filter-dimmed', !active);
        l.classList.toggle('link-active', active);
      } else {
        l.classList.remove('link-filter-dimmed', 'link-active');
      }
    });
  }

  /* ============ ПУТЬ ============ */
  let selectedId = null;
  const pathInfo = document.getElementById('pathInfo');

  function getAncestors(id) {
    const path = [];
    let cur = id;
    const seen = new Set();
    while (cur && !seen.has(cur)) {
      seen.add(cur);
      path.unshift(cur);
      cur = nodes[cur] ? nodes[cur].parent : null;
    }
    return path;
  }

  function getDescendants(id) {
    const result = [];
    const stack = [id];
    const seen = new Set();
    while (stack.length) {
      const cur = stack.pop();
      (childrenOf[cur] || []).forEach(c => {
        if (!seen.has(c)) { seen.add(c); result.push(c); stack.push(c); }
      });
    }
    return result;
  }

  function clearAll() {
    nodeEls.forEach(n => {
      n.classList.remove('search-dimmed','search-match','path-dimmed','path-active','path-descendant','path-neighbor');
    });
    linkEls.forEach(l => l.classList.remove('link-dimmed','link-active','link-neighbor'));
    relatedEls.forEach(l => l.classList.remove('link-dimmed','link-active','link-neighbor'));
    pathInfo.style.display = 'none';
    selectedId = null;
    document.getElementById('searchInput').value = '';
  }

  function highlightPath(id) {
    if (selectedId === id) { clearAll(); return; }
    selectedId = id;

    const ancestors = getAncestors(id);
    const descendants = getDescendants(id);
    const descSet = new Set(descendants);
    const pathSet = new Set(ancestors.concat(descendants));

    const neighborSet = new Set();
    pathSet.forEach(pid => {
      (neighborsOf[pid] || new Set()).forEach(nid => {
        if (!pathSet.has(nid)) neighborSet.add(nid);
      });
    });

    nodeEls.forEach(n => {
      const nid = n.dataset.id;
      n.classList.remove('search-dimmed','search-match');
      if (pathSet.has(nid)) {
        n.classList.remove('path-dimmed','path-neighbor');
        n.classList.add('path-active');
        if (descSet.has(nid)) n.classList.add('path-descendant');
        else n.classList.remove('path-descendant');
      } else if (neighborSet.has(nid)) {
        n.classList.remove('path-dimmed','path-active','path-descendant');
        n.classList.add('path-neighbor');
      } else {
        n.classList.add('path-dimmed');
        n.classList.remove('path-active','path-descendant','path-neighbor');
      }
    });

    linkEls.forEach(l => {
      const from = l.dataset.from, to = l.dataset.to;
      if (pathSet.has(from) && pathSet.has(to)) {
        l.classList.add('link-active');
        l.classList.remove('link-dimmed','link-neighbor');
      } else if ((pathSet.has(from) && neighborSet.has(to)) ||
                 (neighborSet.has(from) && pathSet.has(to))) {
        l.classList.add('link-neighbor');
        l.classList.remove('link-dimmed','link-active');
      } else {
        l.classList.add('link-dimmed');
        l.classList.remove('link-active','link-neighbor');
      }
    });

    relatedEls.forEach(l => {
      const from = l.dataset.from, to = l.dataset.to;
      const fromIn = pathSet.has(from) || neighborSet.has(from);
      const toIn = pathSet.has(to) || neighborSet.has(to);
      if (fromIn && toIn) {
        const bothPath = pathSet.has(from) && pathSet.has(to);
        if (bothPath) {
          l.classList.add('link-active');
          l.classList.remove('link-dimmed','link-neighbor');
        } else {
          l.classList.add('link-neighbor');
          l.classList.remove('link-dimmed','link-active');
        }
      } else {
        l.classList.add('link-dimmed');
        l.classList.remove('link-active','link-neighbor');
      }
    });

    const currentNode = nodes[id];
    const st = ST[currentNode.status] || ST.work;
    const cat = CATS[currentNode.cat];

    let html = '';

    if (ancestors.length > 1) {
      html += '<h4>ПУТЬ ЭВОЛЮЦИИ</h4>';
      ancestors.slice(0, -1).forEach(pid => {
        const nd = nodes[pid];
        if (!nd) return;
        const s = ST[nd.status] || ST.work;
        const c = CATS[nd.cat];
        const relTag = nd.relation && nd.relation !== 'parent' ? `<span class="rel-tag">${escapeHtml(nd.relation)}</span>` : '';
        const dotClass = nd.cat === 'scifi' ? 'dot-di' : nd.cat === 'horizon' ? 'dot-sq' : 'dot';
        html += `<div class="step"><span class="${dotClass}" style="background:${s.c};box-shadow:0 0 8px ${s.c}"></span><span class="year">${nd.year}</span><span style="color:${c.c}">${escapeHtml(nd.name)}</span>${relTag}</div>`;
      });
    }

    html += `<h4>ВЫБРАНО</h4>`;
    const dotClass = currentNode.cat === 'scifi' ? 'dot-di' : currentNode.cat === 'horizon' ? 'dot-sq' : 'dot';
    html += `<div class="step current"><span class="${dotClass}" style="background:${st.c};box-shadow:0 0 8px ${st.c}"></span><span class="year">${currentNode.year}</span><span style="color:${cat.c}">${escapeHtml(currentNode.name)}</span></div>`;
    if (currentNode.owner) {
      html += `<div class="step" style="color:#8899bb;font-size:11px;padding-left:18px">Источник: ${escapeHtml(currentNode.owner)}</div>`;
    }

    const realDesc = descendants.filter(d => FUTURE_STATUSES.indexOf(nodes[d].status) === -1);
    const futureDesc = descendants.filter(d => FUTURE_STATUSES.indexOf(nodes[d].status) !== -1);

    if (realDesc.length > 0) {
      html += `<h4>ПУТЬ РАЗВИТИЯ · ${realDesc.length}</h4>`;
      realDesc.slice().sort((a, b) => nodes[a].year - nodes[b].year).forEach(pid => {
        const nd = nodes[pid];
        if (!nd) return;
        const s = ST[nd.status] || ST.work;
        const c = CATS[nd.cat];
        const depth = getAncestors(pid).length - 1;
        const indent = Math.min(depth, 6) * 10;
        html += `<div class="step" style="padding-left:${indent}px"><span class="dot" style="background:${s.c};box-shadow:0 0 8px ${s.c}"></span><span class="year">${nd.year}</span><span style="color:${c.c}">${escapeHtml(nd.name)}</span></div>`;
      });
    }

    if (futureDesc.length > 0) {
      html += `<h4>ГОРИЗОНТ СОБЫТИЙ · ${futureDesc.length}</h4>`;
      futureDesc.slice().sort((a, b) => nodes[a].year - nodes[b].year).forEach(pid => {
        const nd = nodes[pid];
        if (!nd) return;
        const s = ST[nd.status] || ST.work;
        const c = CATS[nd.cat];
        const depth = getAncestors(pid).length - 1;
        const indent = Math.min(depth, 6) * 10;
        const dc = nd.cat === 'scifi' ? 'dot-di' : nd.cat === 'horizon' ? 'dot-sq' : 'dot';
        html += `<div class="step" style="padding-left:${indent}px"><span class="${dc}" style="background:${s.c};box-shadow:0 0 8px ${s.c}"></span><span class="year">${nd.year}</span><span style="color:${c.c}">${escapeHtml(nd.name)}</span></div>`;
      });
    }

    if (descendants.length === 0) {
      html += `<h4>ПУТЬ РАЗВИТИЯ</h4><div class="step" style="color:#445;font-size:11px">Нет подтверждённых потомков</div>`;
    }

    const relatedTo = [];
    RELATED.forEach(([a, b, label]) => {
      if (a === id || b === id) relatedTo.push([a === id ? b : a, label]);
    });

    if (relatedTo.length > 0) {
      html += `<h4>СВЯЗАННЫЕ СЕРВИСЫ</h4>`;
      relatedTo.forEach(([oid, label]) => {
        const nd = nodes[oid];
        if (!nd) return;
        const s = ST[nd.status] || ST.work;
        const c = CATS[nd.cat];
        html += `<div class="step"><span class="dot" style="background:${s.c};box-shadow:0 0 8px ${s.c}"></span><span class="year">${nd.year}</span><span style="color:${c.c}">${escapeHtml(nd.name)}</span><span class="rel-tag">${escapeHtml(label)}</span></div>`;
      });
    }

    if (neighborSet.size > 0) {
      html += `<div class="neighbor-hint">На карте также подсвечены ${neighborSet.size} связанных узлов — они образуют контекст вокруг выбранного пути.</div>`;
    }

    pathInfo.innerHTML = html;
    pathInfo.style.display = 'block';
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  gNodes.addEventListener('click', e => {
    const g = e.target.closest('.node');
    if (!g) return;
    e.stopPropagation();
    highlightPath(g.dataset.id);
  });

  wrap.addEventListener('click', e => {
    if (dragMoved) { dragMoved = false; return; }
    if (!e.target.closest('.node')) clearAll();
  });

  /* ============ ПОИСК ============ */
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');

  function filterNodes(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      nodeEls.forEach(n => {
        n.classList.remove('search-dimmed','search-match','path-dimmed','path-active','path-descendant','path-neighbor');
      });
      linkEls.forEach(l => l.classList.remove('link-dimmed','link-active','link-neighbor'));
      relatedEls.forEach(l => l.classList.remove('link-dimmed','link-active','link-neighbor'));
      pathInfo.style.display = 'none';
      selectedId = null;
      return;
    }
    nodeEls.forEach(n => {
      const nd = nodes[n.dataset.id];
      if (!nd) return;
      const match = nd.name.toLowerCase().indexOf(q) !== -1 ||
                    (nd.extra && nd.extra.toLowerCase().indexOf(q) !== -1) ||
                    (nd.source && nd.source.toLowerCase().indexOf(q) !== -1) ||
                    (nd.owner && nd.owner.toLowerCase().indexOf(q) !== -1) ||
                    String(nd.year).indexOf(q) !== -1;
      n.classList.toggle('search-dimmed', !match);
      n.classList.toggle('search-match', match);
      n.classList.remove('path-dimmed','path-active','path-descendant','path-neighbor');
    });
    linkEls.forEach(l => l.classList.remove('link-active','link-dimmed','link-neighbor'));
    relatedEls.forEach(l => l.classList.remove('link-active','link-dimmed','link-neighbor'));
    pathInfo.style.display = 'none';
    selectedId = null;
  }

  searchInput.addEventListener('input', e => filterNodes(e.target.value));
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearAll();
    searchInput.focus();
  });

  /* ============ TOOLTIP ============ */
  const tip = document.getElementById('tip');

  gNodes.addEventListener('mouseover', e => {
    const g = e.target.closest('.node');
    if (!g) return;
    const nd = nodes[g.dataset.id];
    if (!nd) return;
    const st = ST[nd.status] || ST.work;
    const cat = CATS[nd.cat];

    tip.textContent = '';
    const b = document.createElement('b');
    b.textContent = nd.name;
    tip.appendChild(b);

    const m1 = document.createElement('div');
    m1.className = 'meta';
    m1.textContent = nd.year + ' · ' + cat.l;
    tip.appendChild(m1);

    if (nd.extra) {
      const m2 = document.createElement('div');
      m2.className = 'meta';
      m2.style.marginTop = '6px';
      m2.style.color = '#aab';
      m2.textContent = nd.extra;
      tip.appendChild(m2);
    }

    if (nd.owner) {
      const mo = document.createElement('div');
      mo.className = 'owner';
      mo.textContent = 'Источник: ' + nd.owner;
      tip.appendChild(mo);
    }

    if (nd.source) {
      const m3 = document.createElement('div');
      m3.className = 'src';
      m3.textContent = 'Ссылка: ' + nd.source;
      tip.appendChild(m3);
    }

    const s = document.createElement('span');
    s.className = 'st';
    s.style.cssText = `background:${st.c}22;color:${st.c};border:1px solid ${st.c}66`;
    s.textContent = st.l;
    tip.appendChild(s);

    tip.style.display = 'block';
  });

  gNodes.addEventListener('mousemove', e => {
    const g = e.target.closest('.node');
    if (!g) { tip.style.display = 'none'; return; }
    tip.style.left = Math.min(e.clientX + 16, window.innerWidth - 400) + 'px';
    tip.style.top = Math.min(e.clientY + 16, window.innerHeight - 260) + 'px';
  });

  gNodes.addEventListener('mouseout', () => { tip.style.display = 'none'; });

  /* ============ ЛЕГЕНДА ============ */
  const legend = document.getElementById('legend');

  function countByStatus() {
    const counts = {};
    ALL_NODES.forEach(id => {
      const nd = nodes[id];
      if (!nd) return;
      counts[nd.status] = (counts[nd.status] || 0) + 1;
    });
    return counts;
  }

  function countByCat() {
    const counts = {};
    ALL_NODES.forEach(id => {
      const nd = nodes[id];
      if (!nd) return;
      counts[nd.cat] = (counts[nd.cat] || 0) + 1;
    });
    return counts;
  }

  function renderLegend() {
    const statusCounts = countByStatus();
    let html = '';

    Object.keys(LAYERS).forEach(layerKey => {
      const layer = LAYERS[layerKey];
      html += `<h3>${layer.l}</h3>`;
      layer.statuses.forEach(statusKey => {
        const v = ST[statusKey];
        if (!v) return;
        const cnt = statusCounts[statusKey] || 0;
        const active = activeStatuses.has(statusKey) ? ' active' : '';
        const dotClass = (layerKey === 'horizon') ? 'd-sq'
                       : (layerKey === 'scifi') ? 'd-di'
                       : (layerKey === 'forecast') ? 'd-dash'
                       : '';
        html += `<div class="item${active}" data-status="${statusKey}">
          <span class="d ${dotClass}" style="background:${v.c};color:${v.c};box-shadow:0 0 8px ${v.c}"></span>
          <span>${v.l}</span>
          <span class="cnt">${cnt}</span>
        </div>`;
      });
    });

    html += `<div class="reset" id="resetStatuses">✕ СБРОСИТЬ ФИЛЬТРЫ СТАТУСА</div>`;
    legend.innerHTML = html;

    legend.querySelectorAll('.item').forEach(item => {
      item.addEventListener('click', e => {
        e.stopPropagation();
        const statusKey = item.dataset.status;
        if (activeStatuses.has(statusKey)) activeStatuses.delete(statusKey);
        else activeStatuses.add(statusKey);
        applyFilters();
        renderLegend();
        updateStats();
      });
    });

    const resetBtn = document.getElementById('resetStatuses');
    if (resetBtn) {
      resetBtn.addEventListener('click', e => {
        e.stopPropagation();
        activeStatuses.clear();
        applyFilters();
        renderLegend();
        updateStats();
      });
    }
  }

  /* ============ ФИЛЬТР ПО КАТЕГОРИЯМ ============ */
  const catFilters = document.getElementById('catFilters');

  function renderCatFilters() {
    const catCounts = countByCat();
    let html = '<h3>КАТЕГОРИИ</h3>';

    Object.keys(CATS).forEach(catKey => {
      const c = CATS[catKey];
      const cnt = catCounts[catKey] || 0;
      if (cnt === 0) return;
      const active = activeCats.has(catKey) ? ' active' : '';
      html += `<div class="item${active}" data-cat="${catKey}">
        <span class="d" style="background:${c.c};color:${c.c};box-shadow:0 0 8px ${c.c}"></span>
        <span>${c.l}</span>
        <span class="cnt">${cnt}</span>
      </div>`;
    });

    html += `<div class="reset" id="resetCats">✕ СБРОСИТЬ ФИЛЬТРЫ КАТЕГОРИЙ</div>`;
    catFilters.innerHTML = html;

    catFilters.querySelectorAll('.item').forEach(item => {
      item.addEventListener('click', e => {
        e.stopPropagation();
        const catKey = item.dataset.cat;
        if (activeCats.has(catKey)) activeCats.delete(catKey);
        else activeCats.add(catKey);
        applyFilters();
        renderCatFilters();
        updateStats();
      });
    });

    const resetBtn = document.getElementById('resetCats');
    if (resetBtn) {
      resetBtn.addEventListener('click', e => {
        e.stopPropagation();
        activeCats.clear();
        applyFilters();
        renderCatFilters();
        updateStats();
      });
    }
  }

  /* ============ СТАТИСТИКА ============ */
  const stats = document.getElementById('stats');

  function updateStats() {
    const total = ALL_NODES.length;
    let visible = 0;
    ALL_NODES.forEach(id => {
      const nd = nodes[id];
      if (!nd) return;
      const statusMatch = activeStatuses.size === 0 || activeStatuses.has(nd.status);
      const catMatch = activeCats.size === 0 || activeCats.has(nd.cat);
      if (statusMatch && catMatch) visible++;
    });

    const filterActive = activeStatuses.size > 0 || activeCats.size > 0;

    let html = `<div class="stat${filterActive ? ' active-stat' : ''}"><span>ПОКАЗАНО:</span><b>${visible}</b></div>`;
    html += `<div class="stat"><span>ВСЕГО:</span><b>${total}</b></div>`;

    if (activeStatuses.size > 0) {
      const parts = [];
      activeStatuses.forEach(s => {
        if (ST[s]) parts.push(`<span style="color:${ST[s].c}">${ST[s].l}</span>`);
      });
      html += `<div class="stat"><span>СТАТУС:</span>${parts.join(' + ')}</div>`;
    }
    if (activeCats.size > 0) {
      const parts = [];
      activeCats.forEach(c => {
        if (CATS[c]) parts.push(`<span style="color:${CATS[c].c}">${CATS[c].l}</span>`);
      });
      html += `<div class="stat"><span>КАТЕГОРИЯ:</span>${parts.join(' + ')}</div>`;
    }

    stats.innerHTML = html;
  }

  /* ============ ИНИЦИАЛИЗАЦИЯ ============ */
  renderLegend();
  renderCatFilters();
  updateStats();

  console.log('yaMetaverse загружена.');
  console.log('Продуктов:', RAW.length);
  console.log('Горизонт + SCI-FI:', HORIZON.length);
  console.log('Всего узлов:', ALL_NODES.length);

})();
</script>
</body>
</html>
